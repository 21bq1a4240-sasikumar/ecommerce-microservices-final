
spring.application.name=api-gateway
server.port=8083

spring.cloud.gateway.server.webmvc.routes[0].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://catalog-service:8080/api/products
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/catalog/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://inventory-service:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/inventory/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://order-service:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/orders/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1
