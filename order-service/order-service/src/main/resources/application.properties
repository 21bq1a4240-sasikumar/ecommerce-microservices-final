
spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:postgresql://order-db:5432/order_db
spring.datasource.username=order_user
spring.datasource.password=${DB_PASSWORD}

catalog.service.url=http://catalog-service:8080
inventory.service.url=http://inventory-service:8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

resilience4j.retry.instances.inventoryService.max-attempts=3
resilience4j.retry.instances.inventoryService.wait-duration=1s
resilience4j.retry.instances.inventoryService.retry-exceptions=java.io.IOException,org.springframework.web.reactive.function.client.WebClientRequestException

resilience4j.timelimiter.instances.inventoryService.timeout-duration=15s

resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=10s
